name: Refresh iOS dependency lock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ios-lock
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: 3.3.6
      - name: Install JavaScript and Ruby dependencies
        working-directory: mobile
        run: |
          npm install --global npm@10.9.3
          npm ci
          gem install bundler --version 4.0.19 --no-document
          bundle _4.0.19_ update --bundler
          bundle _4.0.19_ install
      - name: Regenerate native locks and macOS verification metadata
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://rokn.app/api/
        run: |
          cd android
          ./gradlew -q \
            -I ../scripts/android-license-inventory.init.gradle \
            :app:roknResolvedReleaseLicenseInputs \
            "-ProknLicenseInventoryOutput=$RUNNER_TEMP/android-license-inputs.json" \
            --write-verification-metadata sha256
          test -s "$RUNNER_TEMP/android-license-inputs.json"
          cd ..
          npm run test:release-scripts -- --test-name-pattern="Gradle dependency provenance"
          cd ios
          rm -rf Pods Podfile.lock
          bundle _4.0.19_ exec pod install
          cd ..
          npm run verify:ios-lock
      - name: Commit native locks before the slower legal inventory
        run: |
          git config user.name "Rokn Release Automation"
          git config user.email "roknproduction@gmail.com"
          git add mobile/ios/Podfile.lock mobile/android/gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "Native locks are already current."
          else
            git commit -m "Refresh native dependency locks"
            git push origin HEAD:main
          fi
      - name: Regenerate native legal provenance
        working-directory: mobile
        run: |
          npm run notices:native:generate
          npm run licenses:native:check
      - name: Commit the generated legal provenance
        run: |
          git config user.name "Rokn Release Automation"
          git config user.email "roknproduction@gmail.com"
          git add mobile
          if git diff --cached --quiet; then
            echo "Native legal provenance is already current."
            exit 0
          fi
          git commit -m "Refresh native legal provenance"
          git push origin HEAD:main

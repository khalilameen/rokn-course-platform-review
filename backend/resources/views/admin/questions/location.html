 <input

      placeholder="Search Box"
    />
<div id='map'></div>

<script>
var geocodeResults;

  
  
   function getAddressLevel(results, level){
      for(x=0; x<results.length; x++){
          address_arr = results[x].address_components; 
          for(i=0; i<address_arr.length; i++){
              address_item = address_arr[i];
              if(address_item.types.includes(level)){
                  return address_item.long_name;
              }
          }
      }
  }
  
  
  
  function setFormData(lat,lng,geocodeResults){ 
      //region = getAddressLevel(obj, "administrative_area_level_1");
      //document.getElementById('region').value = region;
      console.log()
      document.getElementById('lat').value = lat;
      document.getElementById('lng').value = lng;
      console.log(geocodeResults);
      if(!geocodeResults.length){
        alert('من فضلك اختر من الخريطة مرة أخرى !');
      }else{
      document.getElementById('google_place_id').value = geocodeResults[0].place_id;
      }
  }
  
  
  
  
  
  
    function showMap(position){
      pos = {lng:position.coords.longitude,lat:position.coords.latitude};
       console.log(pos);
      
      var map = new google.maps.Map(document.getElementById('map'), {zoom: 12, center: pos});
      console.log('pos');     

      var marker = new google.maps.Marker({position: pos, map: map, draggable:true});
        // Create the search box and link it to the UI element.
  var input = document.getElementById("pac-input");
  var searchBox = new google.maps.places.SearchBox(input);
  console.log(map.controls);
  console.log(google.maps.ControlPosition.TOP_LEFT);
  map.controls[google.maps.ControlPosition.TOP_LEFT].push(input);

  // Bias the SearchBox results towards current map's viewport.
  map.addListener("bounds_changed", function() {
    searchBox.setBounds(map.getBounds());
  });

  var markers = [];
  // Listen for the event fired when the user selects a prediction and retrieve
  // more details for that place.
  searchBox.addListener("places_changed", function() {
    var places = searchBox.getPlaces();

    if (places.length == 0) {
      return;
    }

    // Clear out the old markers.
    markers.forEach(function(marker) {
      marker.setMap(null);
    });
    markers = [];

    // For each place, get the icon, name and location.
    var bounds = new google.maps.LatLngBounds();
    places.forEach(function(place) {
      if (!place.geometry) {
        console.log("Returned place contains no geometry");
        return;
      }
      var icon = {
        url: place.icon,
        size: new google.maps.Size(71, 71),
        origin: new google.maps.Point(0, 0),
        anchor: new google.maps.Point(17, 34),
        scaledSize: new google.maps.Size(25, 25)
      };

      // Create a marker for each place.
      markers.push(
        new google.maps.Marker({
          map: map,
          //icon: icon,
          title: place.name,
          position: place.geometry.location,
          draggable:true
        })
      );
    markers.forEach(function(marker) {
      google.maps.event.addListener(marker, 'dragend', function() {
         console.log('pos');
           geocodePosition(marker.getPosition());
           setTimeout(function(){
            console.log(geocodeResults);
          setFormData(marker.getPosition().lat(),marker.getPosition().lng(),geocodeResults);  
           },300);

      });
    });
      if (place.geometry.viewport) {
        // Only geocodes have viewport.
        bounds.union(place.geometry.viewport);
      } else {
        bounds.extend(place.geometry.location);
      }
    });
    map.fitBounds(bounds);
  });
           // setFormData(marker.getPosition().lat(),marker.getPosition().lng());
     // console.log(marker.getPosition());
      google.maps.event.addListener(marker, 'dragend', function() {
         console.log('pos');
           geocodePosition(marker.getPosition());
           setTimeout(function(){
            console.log(geocodeResults);
          setFormData(marker.getPosition().lat(),marker.getPosition().lng(),geocodeResults);  
           },300);

      });

      return map;
    }
     

     function geocodePosition(pos) {
       geocoder = new google.maps.Geocoder();
       geocoder.geocode ({
            latLng: pos
        }, 
            function(results, status) 
            {
                if (status == google.maps.GeocoderStatus.OK) 
                {
                  console.log(results);
                  //  setFormData(results);
                 // return results;
                 geocodeResults = results;
                } 
                else 
                {
                    alert("error");
                }
            }
        );
    }

function initMap(position) {
  //console.log(latitude && longitude);
  //var longitude = '';
  //var latitude = '';
  console.log(latitude && longitude);
  if(typeof latitude !== 'undefined' && typeof longitude !== 'undefined' ){
  var postion = new google.maps.LatLng(latitude, longitude);
  postion.coords = {};
  postion.coords.latitude = latitude;
  postion.coords.longitude = longitude;
  console.log(postion);
    var map = showMap(postion);
  }else if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(showMap);
  } else {
    alert("Geolocation is not supported by this browser.");
  }

}



     
    
</script>
